CONFIG_GPIO=y

# EG800Q UART
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# RTT bridge to the PC (over the debug probe)
CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=2048
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=256

# No console/logging - RTT channel 0 is used directly by the bridge
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_RTT_CONSOLE=n
CONFIG_LOG=n